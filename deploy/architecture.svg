<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405" role="img" aria-labelledby="title description">
  <title id="title">FastMOT camera architecture</title>
  <desc id="description">A live or simulated RTSP input feeds a CPU service. YOLO26s and TrackTrack update boxes and IDs at a target of 4 FPS. Optical flow propagates the boxes in the 30 FPS preview. Caddy serves the annotated JPEG stream to a browser on the LAN.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#526582"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, sans-serif; fill: #152640; text-anchor: middle; }
    .label { font-size: 15px; font-weight: 650; }
    .detail { font-size: 12px; fill: #405575; }
    .box { fill: #fff; stroke: #b7c6da; }
    .feed { fill: none; stroke: #526582; stroke-width: 1.5; marker-end: url(#arrow); }
  </style>

  <rect x="0.5" y="0.5" width="719" height="404" rx="14" fill="#f8fafc" stroke="#d5dfeb"/>
  <rect x="24" y="88" width="672" height="220" rx="12" fill="#eef4fc" stroke="#c2d2e8"/>
  <text x="111" y="113" class="detail" font-weight="700">CAMERA SERVICE · CPU</text>

  <g class="feed">
    <path d="M189 68v8h103v33"/>
    <path d="M531 68v8H428v33"/>
    <path d="M360 153v15H199v16"/>
    <path d="M360 153v15h170v16"/>
    <path d="M328 220h84"/>
    <path d="M530 246v19"/>
    <path d="M530 297v22H318v15"/>
    <path d="M412 358h88"/>
  </g>

  <rect x="72" y="20" width="234" height="48" rx="8" class="box"/>
  <text x="189" y="40" class="label">IP camera</text>
  <text x="189" y="57" class="detail">Live RTSP</text>

  <rect x="414" y="20" width="234" height="48" rx="8" class="box"/>
  <text x="531" y="40" class="label">Sample video</text>
  <text x="531" y="57" class="detail">RTSP via FFmpeg and MediaMTX</text>

  <rect x="240" y="109" width="240" height="44" rx="8" class="box"/>
  <text x="360" y="128" class="label">RTSP capture</text>
  <text x="360" y="144" class="detail">Latest frame</text>

  <rect x="70" y="184" width="258" height="62" rx="8" fill="#e0ebfc" stroke="#9fb6d8"/>
  <text x="199" y="203" class="label">Detection and tracking</text>
  <text x="199" y="220" class="detail">YOLO26s · OpenVINO FP32 · 1280 px</text>
  <text x="199" y="236" class="detail">TrackTrack + YOLO26n ReID · 4 FPS target</text>
  <text x="370" y="208" class="detail">Boxes + IDs</text>

  <rect x="412" y="184" width="236" height="62" rx="8" fill="#e4f3ef" stroke="#a3c7be"/>
  <text x="530" y="210" class="label">Optical flow</text>
  <text x="530" y="230" class="detail">30 FPS display target</text>

  <rect x="412" y="265" width="236" height="32" rx="8" class="box"/>
  <text x="530" y="285" class="detail" font-weight="650">Annotated JPEG · localhost:8003</text>

  <rect x="224" y="334" width="188" height="48" rx="8" class="box"/>
  <text x="318" y="354" class="label">Caddy</text>
  <text x="318" y="371" class="detail">HTTPS + sign-in</text>

  <rect x="500" y="334" width="148" height="48" rx="8" class="box"/>
  <text x="574" y="363" class="label">LAN browser</text>
</svg>
