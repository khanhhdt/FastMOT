<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera trực tiếp · MOT</title>
  <link rel="stylesheet" href="/camera.css">
  <script src="/camera.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Live Camera</h1>
      <p id="connection" role="status">Đang kết nối</p>
    </header>
    <figure>
      <canvas id="flow-video" role="img" aria-label="Luồng camera với khung bao optical flow và ID" hidden></canvas>
      <p id="placeholder">Đang chờ hình ảnh từ camera</p>
    </figure>
    <dl>
      <div><dt>Tốc độ hiển thị</dt><dd id="display-fps">—</dd></div>
      <div><dt>Tốc độ tracking</dt><dd id="fps">—</dd></div>
      <div><dt>Cập nhật optical flow</dt><dd id="flow-fps">—</dd></div>
      <div><dt>Tuổi khung hình tại máy chủ</dt><dd id="age">—</dd></div>
    </dl>
  </main>
</body>
</html>
